<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1 class="flex-center">ClickFast</h1>
        <p class="catchphrase">Sois le plus rapide des clickers du game ⚡</p>

        <p class="countdown flex-center">
          Temps restant : <span id="timer">5</span>s
        </p>

        <div class="flex-center">
          <div class="number" id="score">0</div>
        </div>

        <div class="flex-center buttons">
          <button id="button-clicker" type="button">Clique !</button>
          <button id="button-reset" type="button">Rejouer</button>
        </div>

        <form id="score-form" class="flex-center score-form">
          <label class="sr-only" for="username">Ton pseudo</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ton pseudo"
            maxlength="30"
          />
          <button id="button-submit" type="submit" disabled>
            Envoyer mon score
          </button>
        </form>
        <p id="submit-status" class="status flex-center"></p>

        <h2 class="flex-center">Scoreboard</h2>
        <ol id="scoreboard" class="scoreboard"></ol>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
