name: CI

# Pas de filtre "branches:" ici, volontairement : le workflow se déclenche sur
# TOUTES les branches. Avec un filtre du type `branches: ["main"]`, travailler
# sur une branche renommée ne déclencherait plus rien, sans le moindre message
# d'erreur. C'est le piège le plus silencieux de la CI.
on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Met en cache le dossier de téléchargement npm (~/.npm), avec une clé
          # dérivée du hash de package-lock.json. npm ci reconstruit toujours
          # node_modules à partir du lockfile : le cache accélère l'installation,
          # il ne décide jamais de son contenu. Mesures dans JOURNAL.md.
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Analyser le code avec ESLint
        run: npm run lint

  test:
    name: Test
    # test attend que lint soit vert : si le lint échoue, ce job ne démarre pas
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Met en cache le dossier de téléchargement npm (~/.npm), avec une clé
          # dérivée du hash de package-lock.json. npm ci reconstruit toujours
          # node_modules à partir du lockfile : le cache accélère l'installation,
          # il ne décide jamais de son contenu. Mesures dans JOURNAL.md.
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests Jest
        run: npm test

  security-deps:
    name: Sécurité - dépendances et secrets
    # Aucun needs : ce job démarre en même temps que lint, rien n'oblige à
    # attendre les tests pour vérifier les dépendances.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Indispensable : sans l'historique complet, gitleaks ne relit qu'un
          # seul commit et passerait au vert sans avoir rien vérifié.
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Chaque scanner tourne sans faire échouer son étape : le blocage arrive
      # en dernier, une fois les rapports sauvegardés.
      - name: Auditer les dépendances
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > audit-brut.json

      - name: Rédiger le rapport npm audit
        if: always()
        run: |
          mkdir -p rapports
          node -e '
            const fs = require("fs");
            let rapport;
            try {
              const v = JSON.parse(fs.readFileSync("audit-brut.json", "utf8"));
              const n = v.metadata.vulnerabilities.high + v.metadata.vulnerabilities.critical;
              rapport = {
                scanner: "npm audit",
                statut: n > 0 ? "alerte" : "ok",
                compte: n,
                unite: "vulnerabilites high/critical",
                detail: v.metadata.dependencies.total + " paquets audites"
              };
            } catch (e) {
              rapport = {
                scanner: "npm audit",
                statut: "erreur",
                compte: 0,
                unite: "vulnerabilites high/critical",
                detail: "rapport illisible : " + e.message
              };
            }
            fs.writeFileSync("rapports/rapport-npm-audit.json", JSON.stringify(rapport, null, 2));
          '

      - name: Rechercher des secrets dans tout l'historique
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rédiger le rapport gitleaks
        if: always()
        env:
          RESULTAT_GITLEAKS: ${{ steps.gitleaks.outcome }}
        run: |
          mkdir -p rapports
          node -e '
            const fs = require("fs");
            let n = 0;
            let detail = "historique complet relu";
            try {
              n = JSON.parse(fs.readFileSync("results.sarif", "utf8")).runs[0].results.length;
            } catch {
              // Pas de fichier SARIF : gitleaks n en produit un que s il trouve
              // quelque chose. Rien trouve, ou bien le scanner a echoue.
              if (process.env.RESULTAT_GITLEAKS === "failure") {
                detail = "le scanner a echoue sans produire de rapport";
              }
            }
            const echec = process.env.RESULTAT_GITLEAKS === "failure";
            fs.writeFileSync("rapports/rapport-gitleaks.json", JSON.stringify({
              scanner: "gitleaks",
              statut: n > 0 ? "alerte" : echec ? "erreur" : "ok",
              compte: n,
              unite: "secrets detectes",
              detail: detail
            }, null, 2));
          '

      # Les rapports partent quoi qu il arrive : un scanner qui trouve quelque
      # chose a travaille, son resultat ne doit pas disparaitre avec l echec.
      - name: Envoyer les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-security-deps
          path: rapports/

      - name: Verdict
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let sortie = 0;
            for (const nom of ["npm-audit", "gitleaks"]) {
              let r;
              try {
                r = JSON.parse(fs.readFileSync("rapports/rapport-" + nom + ".json", "utf8"));
              } catch {
                console.error("Rapport manquant : " + nom);
                sortie = 1;
                continue;
              }
              if (r.statut !== "ok") {
                console.error(r.scanner + " : " + r.compte + " " + r.unite + " (" + r.detail + ")");
                sortie = 1;
              }
            }
            process.exit(sortie);
          '

  build-and-push:
    name: Build & Push
    # Ne démarre que si les tests sont verts
    needs: test
    # Publication réservée à main, et uniquement sur un push : on ne publie
    # jamais le travail en chantier d'une pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # build-push-action s'appuie sur Buildx
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Les identifiants ne sont jamais écrits dans ce fichier : ils viennent
      # des secrets du dépôt (Settings > Secrets and variables > Actions).
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Le fichier s'appelle "dockerfile" en minuscule dans ce dépôt,
          # alors que l'action cherche "Dockerfile" par défaut.
          file: ./dockerfile
          push: true
          # Le sha du commit courant : chaque push produit un tag unique,
          # donc une image identifiable et promouvable telle quelle.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}

  security-image:
    name: Sécurité - image publiée
    # Trivy scanne une image déjà construite : ce job n'a de sens qu'après la
    # publication, et n'a donc aucune raison de tourner sur une pull request.
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}

    steps:
      # Sans cette vérification, un tag absent laisserait Trivy scanner dans le
      # vide et le job passerait au vert sans avoir rien examiné.
      - name: Vérifier que le tag est bien publié
        run: |
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::Image introuvable sur Docker Hub : $IMAGE"
            exit 1
          fi
          echo "Image trouvée : $IMAGE"

      - name: Scanner l'image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-brut.json
          # On ne bloque pas ici : le rapport doit partir avant le verdict.
          exit-code: "0"

      - name: Rédiger le rapport Trivy
        if: always()
        env:
          RESULTAT_TRIVY: ${{ steps.trivy.outcome }}
        run: |
          mkdir -p rapports
          node -e '
            const fs = require("fs");
            let n = -1;
            try {
              const t = JSON.parse(fs.readFileSync("trivy-brut.json", "utf8"));
              n = (t.Results || []).reduce((s, r) => s + (r.Vulnerabilities || []).length, 0);
            } catch {}
            const erreur = n < 0 || process.env.RESULTAT_TRIVY === "failure";
            fs.writeFileSync("rapports/rapport-trivy.json", JSON.stringify({
              scanner: "Trivy (image)",
              statut: erreur ? "erreur" : n > 0 ? "alerte" : "ok",
              compte: Math.max(n, 0),
              unite: "CVE high/critical",
              detail: erreur ? "scan non exploitable" : (process.env.GITHUB_SHA || "").slice(0, 12)
            }, null, 2));
          '

      - name: Envoyer le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-security-image
          path: rapports/

      - name: Verdict
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let r;
            try {
              r = JSON.parse(fs.readFileSync("rapports/rapport-trivy.json", "utf8"));
            } catch {
              console.error("Rapport Trivy manquant");
              process.exit(1);
            }
            if (r.statut !== "ok") {
              console.error(r.scanner + " : " + r.compte + " " + r.unite + " (" + r.detail + ")");
              process.exit(1);
            }
          '

  sbom:
    name: Inventaire des composants
    # Le SBOM de l'image suppose que l'image existe : même dépendance que Trivy.
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p sbom rapports

      # Deux périmètres, parce qu'ils ne contiennent pas la même chose : le
      # .dockerignore exclut package.json de l'image, donc un SBOM de l'image
      # ne verrait jamais les dépendances npm.
      - name: Inventorier l'image publiée
        id: sbom_image
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom/sbom-image.cdx.json
          upload-artifact: false

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Sans node_modules, Syft se contente de constater la présence de
      # package-lock.json sans en extraire les paquets : l'inventaire des
      # sources serait vide de toute dépendance npm.
      - name: Installer les dépendances
        run: npm ci

      - name: Inventorier les sources
        id: sbom_sources
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.0
        with:
          # Le lockfile est cible directement : sur un scan de dossier, Syft se
          # contente de le lister comme fichier sans en extraire les paquets.
          file: package-lock.json
          format: cyclonedx-json
          output-file: sbom/sbom-sources.cdx.json
          upload-artifact: false

      - name: Rédiger les rapports SBOM
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            for (const [cle, libelle] of [["image", "SBOM image"], ["sources", "SBOM sources"]]) {
              let n = -1;
              try {
                n = JSON.parse(fs.readFileSync("sbom/sbom-" + cle + ".cdx.json", "utf8")).components.length;
              } catch {}
              fs.writeFileSync("rapports/rapport-sbom-" + cle + ".json", JSON.stringify({
                scanner: libelle,
                statut: n < 0 ? "erreur" : "ok",
                compte: Math.max(n, 0),
                unite: "composants recenses",
                detail: n < 0 ? "inventaire non genere" : "format CycloneDX"
              }, null, 2));
            }
          '

      # Deux artefacts distincts : les inventaires complets d un cote, les
      # petits fichiers de comptage de l autre. Les melanger deverserait les
      # SBOM entiers dans le dossier fusionne du job de resume.
      - name: Publier les SBOM téléchargeables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: warn

      - name: Envoyer les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-sbom
          path: rapports/
          if-no-files-found: warn
